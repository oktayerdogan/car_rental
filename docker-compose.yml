version: '3.8'

services:
  backend:
    build: .
    container_name: rentacar_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db  # Backend artık DB açılmadan açılmayacak
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    container_name: rentacar_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: rentacar
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: